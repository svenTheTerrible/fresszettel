spring.application.name=fresszettel
spring.datasource.url=jdbc:sqlite:db/database.db

spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update

# --- Authentication / JWT ---
jwt.secret=${JWT_SECRET:please-change-this-development-secret-key-should-be-at-least-64-bytes-long-in-a-real-production-environment}
jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:1800000}
jwt.refresh-token-ttl=${JWT_REFRESH_TOKEN_TTL:7200000}
