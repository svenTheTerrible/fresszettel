<>
<form class="fz-grid fz-grid--menu" (ngSubmit)="submitForm()">
  <input
    class="fz-input fz-input--dashed fz-input--no"
    aria-label="Bestellnummer"
    placeholder="Nr."
    [(ngModel)]="menuItem().orderNumber"
  />
  <input
    class="fz-input fz-input--dashed"
    aria-label="Gericht"
    [placeholder]="isInEditing() ? 'Gericht' : 'Neues Gericht'"
    [(ngModel)]="menuItem().name"
  />
  <input
    class="fz-input fz-input--dashed fz-hide-sm"
    style="font-size: 16px"
    aria-label="Beschreibung"
    placeholder="Beschreibung (optional)"
    [(ngModel)]="menuItem().description"
  />
  <input
    class="fz-input fz-input--dashed fz-right"
    aria-label="Preis in Euro"
    placeholder="0,00 €"
    inputMode="decimal"
    [(ngModel)]="menuItem().price"
  />
  <button
    type="submit"
    class="fz-btn"
    [disabled]="busy()"
    style="
      height: 40px;
      padding: 0 8px;
      margin-bottom: 4px;
      font-size: 16px;
      justify-content: center;
    "
  >
    {{ busy() ? 'Moment ...' : isInEditing() ? 'Speichern' : 'Eintragen' }}
  </button>
</form>
@if (error()) {
  <div class="fz-row">
    <span role="status" class="fz-error">
      {{ error() }}
    </span>
  </div>
}
